name: Codzienna Analiza
on:
  schedule:
    - cron: '30 15 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dajemy prawo do zapisu

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pobieramy całą historię, by uniknąć konfliktów

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generuj raport
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate.js

      - name: Automatyczny zapis raportu
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatyczna aktualizacja raportu [skip ci]"
          file_pattern: 'public/raport.json' # Zapisujemy tylko ten jeden plik
          push_options: '--force' # Opcja atomowa: wymuś zapis, jeśli są konflikty
