name: Codzienna Analiza
on:
  schedule:
    - cron: '30 15 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generuj raport
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p public
          node scripts/generate.js
          echo "Lista plików w folderze public:"
          ls -la public/

      - name: Zapisz raport
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Sprawdzamy, czy folder public istnieje i czy coś w nim jest
          if [ -d "public" ]; then
            git add public/
            git commit -m "Automatyczna aktualizacja raportu [skip ci]" || exit 0
            git pull --rebase origin main
            git push origin main
          else
            echo "❌ Folder public nie istnieje!"
            exit 1
          fi
