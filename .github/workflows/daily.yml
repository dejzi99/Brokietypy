name: Codzienna Analiza
on:
  schedule:
    - cron: '30 15 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pobiera całą historię zmian

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generuj raport
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p public
          node scripts/generate.js

      - name: Zapisz i Wymuś (Force Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add public/raport.json
          
          # Zrób commit, a jeśli plik się nie zmienił, po prostu zakończ
          git commit -m "Automatyczna aktualizacja raportu [skip ci]" || exit 0
          
          # KLUCZOWA ZMIANA: Pobieramy zmiany i WYMUSZAMY wysłanie naszego raportu
          git pull --rebase origin main
          git push origin main --force
