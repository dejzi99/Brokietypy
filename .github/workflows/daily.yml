name: Codzienna Analiza
on:
  schedule:
    - cron: '30 15 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generuj raport
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Tworzymy folder i plik ZANIM odpali się Node
          mkdir -p public
          touch public/raport.json
          # Odpalamy skrypt
          node scripts/generate.js
          # Diagnostyka: pokaże nam czy plik tam jest
          ls -l public/raport.json

      - name: Zapisz zmiany
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Dodajemy WSZYSTKO co się zmieniło
          git add .
          
          # Sprawdzamy czy jest co wysłać
          if git diff --staged --quiet; then
            echo "Brak zmian do zapisu."
          else
            git commit -m "Automatyczna aktualizacja raportu [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
