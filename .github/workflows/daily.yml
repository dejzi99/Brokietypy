name: Codzienna Analiza
on:
  schedule:
    - cron: '30 15 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ważne: pobiera całą historię zmian

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generuj raport
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p public
          node scripts/generate.js

      - name: Zapisz raport z obsługą konfliktów
        run: |
          # Konfiguracja bota
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Dodajemy plik raportu
          git add public/raport.json
          
          # Tworzymy commit (tylko jeśli plik się zmienił)
          git commit -m "Automatyczna aktualizacja raportu [skip ci]" || exit 0
          
          # KLUCZOWY MOMENT: Próbujemy wysłać do 5 razy, jeśli ktoś inny (TY) zrobił zmiany w międzyczasie
          for i in {1..5}; do
            git pull --rebase origin main && git push origin main && break || sleep 5
          done
