name: Codzienna Analiza
on:
  schedule:
    - cron: '30 15 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Przygotuj folder i generuj raport
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Wymuszamy stworzenie folderu public, żeby skrypt miał gdzie zapisać plik
          mkdir -p public
          # Odpalamy skrypt
          node scripts/generate.js
          # Sprawdzamy dla pewności, czy plik fizycznie istnieje przed kolejnym krokiem
          ls -l public/

      - name: Automatyczny zapis raportu
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatyczna aktualizacja raportu [skip ci]"
          # Ustawiamy, aby bot szukał WSZYSTKICH zmian w folderze public
          file_pattern: 'public/*.json'
          # Nie wywalaj błędu, jeśli pliku nie ma - po prostu zakończ
          skip_dirty_check: false
          push_options: '--force'
