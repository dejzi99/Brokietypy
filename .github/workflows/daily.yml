name: Codzienna Analiza
on:
  schedule:
    - cron: '30 15 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generuj raport
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Tworzymy folder siłowo w systemie operacyjnym
          mkdir -p public
          # 2. Odpalamy skrypt
          node scripts/generate.js
          # 3. Sprawdzamy co się stało (pokaże się w logach)
          echo "Zawartość folderu public:"
          ls -la public/

      - name: Zapisz zmiany
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Dodajemy wszystko co jest w public (najbezpieczniej)
          git add public/
          
          # Sprawdzamy czy coś się zmieniło
          if git diff --staged --quiet; then
            echo "Brak zmian do zapisu."
          else
            git commit -m "Automatyczna aktualizacja raportu [skip ci]"
            # Pull żeby uniknąć rejected i Push na siłę
            git pull --rebase origin main
            git push origin main
          fi
