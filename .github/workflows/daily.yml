name: Codzienna aktualizacja AI

on:
  schedule:
    - cron: '0 10 * * *' # Odpala się automatycznie każdego dnia
  workflow_dispatch: # Pozwala na ręczne odpalanie z przycisku "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Weryfikuj wczorajsze typy i generuj nowe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p public
          node scripts/verify.js
          node scripts/generate.js

      - name: Zapisz zmiany w bazie danych
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/raport.json
          git add public/historia.json
          git commit -m "🤖 Automatyczna weryfikacja i nowe typy AI" || exit 0
          git push origin main
