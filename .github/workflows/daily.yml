name: Codzienna Analiza
on:
  schedule:
    - cron: '30 15 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generuj raport
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate.js
          # To nam powie czy plik istnieje przed zapisem
          ls -R public/

      - name: Zapisz raport
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # -f wymusza dodanie pliku nawet jeśli jest w .gitignore
          git add -f public/raport.json
          
          git commit -m "Automatyczna aktualizacja raportu [skip ci]" || exit 0
          
          # Próba wysłania z pobraniem zmian
          git pull --rebase origin main
          git push origin main
