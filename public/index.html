<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brokietypy | AI Betting Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Styl Matrix / Neon Green */
        body {
            background-color: #0f172a; /* Ciemny granat/czerń */
            color: #f8fafc;
        }
        .neon-text {
            color: #4ade80;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }
        .neon-border {
            border: 1px solid #4ade80;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.2);
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Animacja ładowania */
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #4ade80;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Ukrywanie elementów */
        .hidden-safely { display: none !important; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center">

    <!-- BRAMKA NA HASŁO -->
    <div id="passwordGate" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900">
        <div class="glass-panel p-8 rounded-2xl max-w-md w-full mx-4 text-center border border-green-500/30">
            <div class="mb-6">
                <i class="fa-solid fa-robot text-5xl neon-text mb-4"></i>
                <h2 class="text-2xl font-bold mb-2">System AI Brokietypy</h2>
                <p class="text-slate-400 text-sm">Dostęp tylko dla zweryfikowanych użytkowników. Wprowadź kod dostępu.</p>
            </div>
            <input type="password" id="passwordInput" placeholder="Wprowadź kod..." 
                   class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-white text-center mb-4 focus:outline-none focus:border-green-400 transition-colors">
            <button onclick="checkPassword()" class="w-full bg-green-500 hover:bg-green-600 text-slate-900 font-bold py-3 rounded-lg transition-colors">
                ODBLOKUJ DOSTĘP
            </button>
            <p id="passwordError" class="text-red-400 text-sm mt-3 hidden-safely">Nieprawidłowy kod dostępu!</p>
        </div>
    </div>

    <!-- GŁÓWNA STRONA (Początkowo ukryta) -->
    <div id="mainContent" class="hidden-safely w-full max-w-4xl px-4 py-8">
        
        <!-- NAGŁÓWEK -->
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-2">
                BROKIE<span class="neon-text">TYPY</span> AI
            </h1>
            <p class="text-slate-400">Algorytmiczna analiza rynków sportowych</p>
        </header>

        <!-- ZAKŁADKI / FILTRY SPORTÓW -->
        <div class="flex justify-center gap-2 mb-8">
            <button onclick="setSportFilter('All')" id="btn-All" class="filter-btn px-6 py-2 rounded-full font-bold bg-green-500 text-slate-900 transition-all">
                Wszystko
            </button>
            <button onclick="setSportFilter('Pilka_Nozna')" id="btn-Pilka_Nozna" class="filter-btn px-6 py-2 rounded-full font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:border-green-500 transition-all">
                ⚽ Piłka Nożna
            </button>
            <button onclick="setSportFilter('NBA')" id="btn-NBA" class="filter-btn px-6 py-2 rounded-full font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:border-green-500 transition-all">
                🏀 NBA
            </button>
        </div>

        <!-- STATYSTYKI -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
            <div class="glass-panel rounded-xl p-4 text-center">
                <p class="text-slate-400 text-xs uppercase tracking-wider mb-1">Skuteczność</p>
                <p id="stat-winrate" class="text-2xl font-bold neon-text">0.0%</p>
            </div>
            <div class="glass-panel rounded-xl p-4 text-center">
                <p class="text-slate-400 text-xs uppercase tracking-wider mb-1">Yield</p>
                <p id="stat-yield" class="text-2xl font-bold text-white">0.00%</p>
            </div>
            <div class="glass-panel rounded-xl p-4 text-center">
                <p class="text-slate-400 text-xs uppercase tracking-wider mb-1">Trafione</p>
                <p id="stat-wins" class="text-2xl font-bold text-green-400">0</p>
            </div>
            <div class="glass-panel rounded-xl p-4 text-center">
                <p class="text-slate-400 text-xs uppercase tracking-wider mb-1">Przegrane</p>
                <p id="stat-losses" class="text-2xl font-bold text-red-400">0</p>
            </div>
        </section>

        <!-- TYPY NA DZIŚ -->
        <section class="mb-12">
            <div class="flex items-center gap-3 mb-6 border-b border-slate-700 pb-2">
                <i class="fa-solid fa-bolt neon-text text-xl"></i>
                <h2 class="text-2xl font-bold">Dzisiejsze Typy</h2>
            </div>
            <div id="todayContainer" class="space-y-4">
                <div class="flex justify-center py-8"><div class="spinner"></div></div>
            </div>
        </section>

        <!-- HISTORIA -->
        <section>
            <div class="flex items-center gap-3 mb-6 border-b border-slate-700 pb-2">
                <i class="fa-solid fa-clock-rotate-left text-slate-400 text-xl"></i>
                <h2 class="text-2xl font-bold text-slate-300">Historia Analiz</h2>
            </div>
            <div id="historyContainer" class="space-y-8">
                <!-- Historia wstrzykiwana przez JS -->
            </div>
        </section>

    </div>

    <script>
        // === KONFIGURACJA HASŁA ===
        const PRAWIDLOWE_HASLO = "KOD123"; // <-- TUTAJ ZMIENIASZ HASŁO DO STRONY

        // Stan aplikacji
        let appData = {
            today: null,
            history: [],
            currentFilter: 'All' // 'All', 'Pilka_Nozna', 'NBA'
        };

        // --- BRAMKA NA HASŁO ---
        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('passwordError');
            
            if (input === PRAWIDLOWE_HASLO || sessionStorage.getItem('auth') === 'true') {
                sessionStorage.setItem('auth', 'true');
                document.getElementById('passwordGate').classList.add('hidden-safely');
                document.getElementById('mainContent').classList.remove('hidden-safely');
                loadData();
            } else {
                errorMsg.classList.remove('hidden-safely');
            }
        }

        // Sprawdź czy użytkownik jest już zalogowany w tej sesji
        if (sessionStorage.getItem('auth') === 'true') {
            document.getElementById('passwordGate').classList.add('hidden-safely');
            document.getElementById('mainContent').classList.remove('hidden-safely');
            loadData();
        }

        // Obliczanie statystyk
        function calculateStats() {
            let wins = 0;
            let losses = 0;
            let totalStaked = 0;
            let totalProfit = 0; // Zysk na czysto

            appData.history.forEach(day => {
                if(!day.mecze) return;
                
                day.mecze.forEach(m => {
                    // Kompatybilność wsteczna - jeśli stary mecz nie ma sportu, uznajemy go za piłkę
                    const matchSport = m.sport || 'Pilka_Nozna'; 

                    // Filtrowanie dyscypliny
                    if (appData.currentFilter !== 'All' && matchSport !== appData.currentFilter) {
                        return; 
                    }

                    if (m.status === 'wygrana') {
                        wins++;
                        totalStaked += 1; // Zakładamy płaską stawkę 1j
                        totalProfit += (parseFloat(m.kurs) - 1); 
                    } else if (m.status === 'przegrana') {
                        losses++;
                        totalStaked += 1;
                        totalProfit -= 1;
                    }
                });
            });

            const winRate = wins + losses > 0 ? ((wins / (wins + losses)) * 100).toFixed(1) : 0;
            const yieldVal = totalStaked > 0 ? ((totalProfit / totalStaked) * 100).toFixed(2) : 0;

            document.getElementById('stat-wins').innerText = wins;
            document.getElementById('stat-losses').innerText = losses;
            document.getElementById('stat-winrate').innerText = winRate + '%';
            
            const yieldEl = document.getElementById('stat-yield');
            yieldEl.innerText = yieldVal + '%';
            if(yieldVal > 0) yieldEl.className = "text-2xl font-bold text-green-400";
            else if(yieldVal < 0) yieldEl.className = "text-2xl font-bold text-red-400";
            else yieldEl.className = "text-2xl font-bold text-white";
        }

        // Filtrowanie Sportu (Zakładki)
        function setSportFilter(sport) {
            appData.currentFilter = sport;
            
            // Aktualizacja wyglądu przycisków
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn px-6 py-2 rounded-full font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:border-green-500 transition-all";
            });
            const activeBtn = document.getElementById('btn-' + sport);
            activeBtn.className = "filter-btn px-6 py-2 rounded-full font-bold bg-green-500 text-slate-900 transition-all";

            // Przelicz od nowa UI
            calculateStats();
            renderMatches();
        }

        // Generowanie pojedynczej karty meczu
        function createMatchCard(m) {
            const matchSport = m.sport || 'Pilka_Nozna';
            const icon = matchSport === 'NBA' ? '🏀' : '⚽';
            
            let statusBadge = `<span class="bg-slate-700 text-slate-300 px-2 py-1 rounded text-xs font-bold uppercase">Oczekujący</span>`;
            if (m.status === 'wygrana') statusBadge = `<span class="bg-green-500/20 text-green-400 border border-green-500/50 px-2 py-1 rounded text-xs font-bold uppercase">Wygrana</span>`;
            if (m.status === 'przegrana') statusBadge = `<span class="bg-red-500/20 text-red-400 border border-red-500/50 px-2 py-1 rounded text-xs font-bold uppercase">Przegrana</span>`;
            if (m.status === 'błąd') statusBadge = `<span class="bg-orange-500/20 text-orange-400 border border-orange-500/50 px-2 py-1 rounded text-xs font-bold uppercase">Błąd API</span>`;

            return `
                <div class="glass-panel rounded-xl p-5 hover:border-green-500/50 transition-colors">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-2 text-slate-300 text-sm">
                            <span>${icon}</span>
                            <span>${m.godzina || ''}</span>
                        </div>
                        ${statusBadge}
                    </div>
                    <h3 class="text-lg font-bold text-white mb-4">${m.mecz}</h3>
                    
                    <div class="flex flex-col md:flex-row gap-4 mb-4">
                        <div class="bg-slate-800/80 rounded-lg p-3 flex-1 border border-slate-700">
                            <p class="text-xs text-slate-400 uppercase mb-1">Typ Algorytmu</p>
                            <p class="font-bold text-green-400">${m.typ}</p>
                        </div>
                        <div class="bg-slate-800/80 rounded-lg p-3 w-full md:w-32 border border-slate-700 text-center">
                            <p class="text-xs text-slate-400 uppercase mb-1">Kurs</p>
                            <p class="font-bold text-white">${m.kurs}</p>
                        </div>
                    </div>
                    
                    <div class="bg-slate-900/50 rounded-lg p-4 border border-slate-700/50 text-sm text-slate-300 leading-relaxed">
                        <p><span class="text-green-400 font-bold mr-1">> AI:</span> ${m.analiza}</p>
                    </div>
                </div>
            `;
        }

        // Renderowanie meczów
        function renderMatches() {
            const todayContainer = document.getElementById('todayContainer');
            const historyContainer = document.getElementById('historyContainer');
            
            todayContainer.innerHTML = '';
            historyContainer.innerHTML = '';

            // Dzisiejsze
            let dzisiejszeHTML = '';
            if (appData.today && appData.today.mecze) {
                const filteredToday = appData.today.mecze.filter(m => {
                    const matchSport = m.sport || 'Pilka_Nozna';
                    return appData.currentFilter === 'All' || matchSport === appData.currentFilter;
                });

                if (filteredToday.length > 0) {
                    filteredToday.forEach(m => dzisiejszeHTML += createMatchCard(m));
                } else {
                    dzisiejszeHTML = `<p class="text-slate-500 text-center italic py-4">Brak typów na dziś dla wybranej dyscypliny.</p>`;
                }
            } else {
                dzisiejszeHTML = `<p class="text-slate-500 text-center italic py-4">Algorytm w trakcie obliczeń...</p>`;
            }
            todayContainer.innerHTML = dzisiejszeHTML;

            // Historia
            let historiaHTML = '';
            // Odwracamy historie zeby najnowsze dni byly wyzej
            const reversedHistory = [...appData.history].reverse(); 

            reversedHistory.forEach(day => {
                if(!day.mecze) return;
                
                const filteredHistoryMecze = day.mecze.filter(m => {
                    const matchSport = m.sport || 'Pilka_Nozna';
                    return appData.currentFilter === 'All' || matchSport === appData.currentFilter;
                });

                if (filteredHistoryMecze.length > 0) {
                    historiaHTML += `
                        <div class="mb-8">
                            <h3 class="text-xl font-bold text-slate-400 mb-4 ml-2 border-l-4 border-slate-600 pl-3">${day.data}</h3>
                            <div class="space-y-4">
                                ${filteredHistoryMecze.map(m => createMatchCard(m)).join('')}
                            </div>
                        </div>
                    `;
                }
            });

            if (historiaHTML === '') {
                historiaHTML = `<p class="text-slate-500 text-center italic py-4">Brak meczów w historii dla tej dyscypliny.</p>`;
            }
            historyContainer.innerHTML = historiaHTML;
        }

        // Pobieranie danych JSON
        async function loadData() {
            try {
                // Dodajemy timestamp, zeby przegladarka nie cachowala starych plikow
                const ts = new Date().getTime(); 
                
                const [raportRes, historiaRes] = await Promise.all([
                    fetch(`raport.json?t=${ts}`),
                    fetch(`historia.json?t=${ts}`)
                ]);

                if (raportRes.ok) appData.today = await raportRes.json();
                if (historiaRes.ok) appData.history = await historiaRes.json();

                calculateStats();
                renderMatches();

            } catch (err) {
                console.error("Błąd wczytywania danych:", err);
                document.getElementById('todayContainer').innerHTML = `<p class="text-red-400 text-center py-4">Błąd wczytywania bazy danych AI.</p>`;
            }
        }

        // Aktywacja inputa na enter
        document.getElementById('passwordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
