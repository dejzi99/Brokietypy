<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Value Bets AI - BROKIETYPY</title>
<style>
    :root {
        --bg: #0d0f12;
        --card-bg: #161a1e;
        --accent: #00ff66;
        --text: #ffffff;
        --text-dim: #888;
        --error: #ff4444;
        --pending: #ffaa00;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; text-align: center; padding: 20px; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; }
    .green { color: var(--accent); text-transform: uppercase; }
    h1 { font-size: 42px; font-weight: 900; letter-spacing: -1.5px; margin: 20px 0; }

    /* Bramka Logowania */
    #login-screen { margin-top: 10vh; }
    .login-input { width: 80%; max-width: 300px; padding: 15px; border-radius: 8px; border: 2px solid #333; background: #0d0f12; color: #fff; text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 20px; outline: none; transition: 0.3s; }
    .login-input:focus { border-color: var(--accent); }
    .login-btn { background: var(--accent); color: #000; font-weight: 900; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 255, 102, 0.2); }
    #login-error { color: var(--error); margin-top: 15px; font-weight: bold; display: none; }

    /* Zakładki (Tabs) */
    .tabs { display: flex; gap: 10px; margin-top: 30px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 15px; background: #1a1e24; border: 1px solid #333; color: var(--text-dim); border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
    .tab-btn:hover { background: #22272e; }
    .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .tab-content { display: none; text-align: left; }
    .tab-content.active { display: block; }

    /* Stats Panel */
    .stats-panel { display: flex; justify-content: space-between; background: #1a1e24; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
    .stat-box { flex: 1; text-align: center; border-right: 1px solid #333; }
    .stat-box:last-child { border-right: none; }
    .stat-value { font-size: 28px; font-weight: 900; }
    .stat-label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }
    
    .profit { color: var(--accent); }
    .loss { color: var(--error); }

    /* Cards */
    .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 15px; text-align: left; border: 1px solid #222; }
    .history-card { opacity: 0.9; }
    
    .match-row { display: block; border-bottom: 1px solid #222; padding: 15px 0; }
    .match-row:last-child { border-bottom: none; }
    .match-header { display: flex; justify-content: space-between; align-items: flex-start; }
    
    .pick-box { background: var(--accent); color: #000; padding: 8px 15px; border-radius: 6px; font-weight: 900; font-size: 16px; min-width: 100px; text-align: center; }
    .pick-box.pending { background: var(--pending); }
    .pick-box.win { background: var(--accent); }
    .pick-box.loss { background: var(--error); color: #fff; }

    .meta { color: #555; font-size: 11px; margin-bottom: 3px; font-weight: bold; }
    .odds-badge { font-size: 14px; font-weight: bold; color: var(--text-dim); margin-top: 8px; text-align: right; }
    
    /* Rozwijana Analiza */
    .toggle-btn { background: transparent; border: 1px solid #444; color: #ccc; padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .toggle-btn:hover { background: #222; border-color: #666; }
    .analysis-content { display: none; margin-top: 15px; padding: 15px; background: #111417; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; color: #bbb; font-size: 13px; line-height: 1.6; }
    .analysis-content.show { display: block; animation: fadeIn 0.3s; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    #error-display { color: var(--error); font-weight: bold; margin: 20px 0; display: none; background: rgba(255,68,68,0.1); padding: 15px; border-radius: 8px; border: 1px solid var(--error); text-align: left; }
</style>
</head>
<body>

<!-- BRAMKA LOGOWANIA -->
<div id="login-screen" class="container">
    <h1>BROKIE<span class="green">TYPY</span></h1>
    <div class="card" style="text-align: center; max-width: 450px; margin: 0 auto;">
        <h2 style="text-align: center; margin-top: 10px; border: none;">BRAMKA DOSTĘPU 🔒</h2>
        <p style="color: var(--text-dim); margin-bottom: 30px;">Wprowadź tajny kod, aby odblokować dzisiejsze typy sztucznej inteligencji.</p>
        
        <input type="password" id="access-code" class="login-input" placeholder="Wpisz kod..." onkeypress="handleKeyPress(event)">
        <br>
        <button class="login-btn" onclick="verifyCode()">ODBLOKUJ DOSTĘP</button>
        
        <div id="login-error">Błędny kod dostępu! Spróbuj ponownie.</div>
    </div>
</div>

<!-- GŁÓWNA APLIKACJA (DOMYŚLNIE UKRYTA) -->
<div id="main-app" class="container" style="display: none;">
    <h1>BROKIE<span class="green">TYPY</span></h1>

    <div id="stats-container"></div>
    <div id="error-display"></div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-dzis', this)">DZISIEJSZE TYPY</button>
        <button class="tab-btn" onclick="switchTab('tab-historia', this)">HISTORIA KUPONÓW</button>
    </div>

    <div id="tab-dzis" class="tab-content active">
        <div id="results">Ładowanie analizy AI...</div>
    </div>

    <div id="tab-historia" class="tab-content">
        <div id="history">Ładowanie historii...</div>
    </div>
</div>

<script>
    // --- KONFIGURACJA BRAMKI LOGOWANIA ---
    const SECRET_CODE = "BROKIE2026"; // <--- TUTAJ ZMIENIASZ HASŁO DO STRONY!

    function verifyCode() {
        const input = document.getElementById('access-code').value;
        if (input === SECRET_CODE) {
            // Zapisujemy w pamięci przeglądarki, że użytkownik jest zalogowany
            localStorage.setItem('brokie_auth_passed', 'true');
            unlockApp();
        } else {
            document.getElementById('login-error').style.display = 'block';
            document.getElementById('access-code').style.borderColor = 'var(--error)';
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') verifyCode();
    }

    function unlockApp() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        // Pobieramy dane dopiero, gdy użytkownik wpisze hasło
        fetchTypy();
        fetchHistory();
    }

    // Sprawdzanie przy starcie strony, czy ktoś już wpisał kiedyś poprawne hasło
    window.onload = () => {
        if (localStorage.getItem('brokie_auth_passed') === 'true') {
            unlockApp();
        }
    };
    // ------------------------------------

    function switchTab(tabId, btnElement) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btnElement.classList.add('active');
    }

    async function fetchTypy() {
        try {
            const res = await fetch('/raport.json?t=' + Date.now());
            if (!res.ok) throw new Error("Plik raportu niedostępny.");
            const data = await res.json();
            
            if (data.error) {
                const errBox = document.getElementById('error-display');
                errBox.style.display = 'block';
                errBox.innerHTML = `Błąd systemu AI ⚠️<br><small style="font-weight:normal">${data.error}</small>`;
            }

            if (!data.mecze || !Array.isArray(data.mecze) || data.mecze.length === 0) {
                document.getElementById('results').innerHTML = "<div class='card'>Czekamy na dzisiejsze typy... ⏳</div>";
                return;
            }

            let html = '<div class="card">';
            data.mecze.forEach(m => {
                if (m.status === 'błąd') return;
                
                let kursStr = m.kurs ? `@${m.kurs}` : '';

                html += `
                    <div class="match-row">
                        <div class="match-header">
                            <div style="flex: 1; padding-right: 15px;">
                                <div class="meta">${m.godzina || 'DZIŚ'} • PIŁKA NOŻNA</div>
                                <div style="font-size: 17px; font-weight: bold;">${m.mecz}</div>
                                <button class="toggle-btn" onclick="this.nextElementSibling.classList.toggle('show')">Czytaj Analizę 🔍</button>
                                <div class="analysis-content">${m.analiza || 'Brak szczegółowej analizy.'}</div>
                            </div>
                            <div style="text-align: right;">
                                <div class="pick-box">${m.typ || 'Typ'}</div>
                                <div class="odds-badge">${kursStr}</div>
                            </div>
                        </div>
                    </div>`;
            });
            html += '</div>';
            document.getElementById('results').innerHTML = html;
        } catch (e) {
            console.error(e);
            document.getElementById('results').innerHTML = "<div class='card' style='border-color: #444;'>Brak dzisiejszego raportu. Sprawdź GitHub Actions.</div>";
        }
    }

    async function fetchHistory() {
        try {
            const res = await fetch('/historia.json?t=' + Date.now());
            if (!res.ok) throw new Error();
            const data = await res.json();
            
            if (!Array.isArray(data)) throw new Error("Zły format historii.");

            let wygrane = 0, przegrane = 0, zysk = 0;
            let html = '';

            data.slice().reverse().forEach(dzien => {
                if (!dzien.mecze || !Array.isArray(dzien.mecze)) return;

                let dzienHtml = `<div class="card history-card"><div class="meta" style="color:#fff; font-size:14px; margin-bottom:10px;">📅 ${dzien.data}</div>`;
                dzien.mecze.forEach(m => {
                    if (!m || m.status === 'błąd') return;
                    
                    let statusClass = 'pending';
                    if (m.status === 'wygrana') { 
                        statusClass = 'win'; 
                        wygrane++; 
                        zysk += (parseFloat(String(m.kurs || 1).replace(',','.')) - 1);
                    }
                    if (m.status === 'przegrana') { 
                        statusClass = 'loss'; 
                        przegrane++; 
                        zysk -= 1; 
                    }

                    dzienHtml += `
                        <div class="match-row" style="opacity: 0.8; font-size: 0.9em;">
                            <div class="match-header">
                                <div style="flex: 1;">
                                    <strong>${m.mecz || 'Mecz'}</strong><br>
                                    <small>${m.typ || 'Typ'}</small>
                                </div>
                                <div style="text-align: right;">
                                    <div class="pick-box ${statusClass}" style="min-width: 80px; font-size: 11px; padding: 5px;">
                                        ${(m.status || 'Oczekujący').toUpperCase()}
                                    </div>
                                    <div class="odds-badge" style="font-size: 12px; margin-top: 4px;">@${m.kurs || '-'}</div>
                                </div>
                            </div>
                        </div>`;
                });
                dzienHtml += `</div>`;
                html += dzienHtml;
            });

            document.getElementById('history').innerHTML = html;

            const total = wygrane + przegrane;
            const winRate = total > 0 ? Math.round((wygrane / total) * 100) : 0;
            const yieldVal = total > 0 ? ((zysk / total) * 100).toFixed(2) : "0.00";

            document.getElementById('stats-container').innerHTML = `
                <div class="stats-panel">
                    <div class="stat-box"><div class="stat-value">${winRate}%</div><div class="stat-label">Skuteczność</div></div>
                    <div class="stat-box"><div class="stat-value ${parseFloat(yieldVal) >= 0 ? 'profit' : 'loss'}">${yieldVal}%</div><div class="stat-label">Yield</div></div>
                    <div class="stat-box"><div class="stat-value">${wygrane}-${przegrane}</div><div class="stat-label">Bilans</div></div>
                </div>`;
        } catch (e) {
            document.getElementById('history').innerHTML = "<div class='card' style='color:#555;'>Archiwum jest puste. Pierwsze wyniki pojawią się jutro.</div>";
        }
    }
</script>

</body>
</html>
