<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Value Bets AI - Codzienne Typy</title>
<style>
body { background: #0d0f12; color: white; font-family: -apple-system, sans-serif; text-align: center; padding: 20px; }
.container { max-width: 800px; margin: 0 auto; }
.green { color: #00ff66; text-transform: uppercase; }
h1 { font-size: 50px; font-weight: 900; letter-spacing: -2px; margin-bottom: 10px; }
h2 { font-size: 24px; margin-top: 40px; color: #aaa; text-align: left; border-bottom: 1px solid #333; padding-bottom: 10px; }

/* Nowy styl dla Panelu Statystyk */
.stats-panel { display: flex; justify-content: space-between; background: #1a1e24; border-radius: 12px; padding: 20px; margin-top: 30px; border: 1px solid #333; }
.stat-box { flex: 1; text-align: center; border-right: 1px solid #333; }
.stat-box:last-child { border-right: none; }
.stat-value { font-size: 32px; font-weight: 900; }
.stat-label { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }
.profit { color: #00ff66; }
.loss { color: #ff4444; }
.neutral { color: #fff; }

.card { background: #161a1e; border-radius: 12px; padding: 25px; margin-top: 20px; text-align: left; border: 1px solid #222; }
.history-card { background: #111417; opacity: 0.95; }
.match-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding: 15px 0; }
.match-row:last-child { border-bottom: none; }
.pick-box { background: #00ff66; color: black; padding: 10px 18px; border-radius: 6px; font-weight: 900; font-size: 18px; }
.pick-box.pending { background: #ffaa00; color: black; }
.pick-box.win { background: #00ff66; color: black; }
.pick-box.loss { background: #ff4444; color: white; }
.meta { color: #555; font-size: 12px; margin-bottom: 4px; }
.reason { color: #777; font-size: 13px; margin-top: 8px; font-style: italic; }
#error-info { color: #ff4444; font-size: 12px; margin-top: 20px; }
.date-header { font-weight: bold; color: #fff; margin-bottom: 10px; font-size: 18px; }
</style>
</head>
<body>
<div class="container">
    <p style="color: #444; font-size: 12px; font-weight: bold; margin-bottom: 0;">CODZIENNIE O 13:00 — POWERED BY GEMINI AI</p>
    <h1>DZIŚ GRAMY <span class="green">MĄDRZE</span></h1>

    <!-- PUSTY POJEMNIK NA STATYSTYKI -->
    <div id="stats-container"></div>

    <div id="results">Ładowanie analizy AI...</div>
    <div id="error-info"></div>

    <h2>HISTORIA TYPÓW</h2>
    <div id="history">Ładowanie historii...</div>
</div>

<script>
    async function fetchTypy() {
        try {
            const response = await fetch('/raport.json?t=' + Date.now());
            const data = await response.json();
            
            if (!data.mecze || data.mecze.length === 0) {
                document.getElementById('results').innerHTML = "Brak typów na dzisiaj. Sprawdź logi Actions.";
                if(data.error) document.getElementById('error-info').innerText = "Szczegóły: " + data.error;
                return;
            }

            let html = '<div class="card">';
            data.mecze.forEach(m => {
                html += `
                    <div class="match-row">
                        <div style="flex: 1;">
                            <div class="meta">${m.godzina || 'DZIŚ'} • PIŁKA NOŻNA</div>
                            <div style="font-size: 18px; font-weight: bold;">${m.mecz}</div>
                            <div class="reason">${m.analiza || ''}</div>
                        </div>
                        <div style="display: flex; align-items: center; margin-left: 20px;">
                            <div class="pick-box">${m.typ}</div>
                            <div style="color: #666; margin-left: 12px; font-weight: bold;">@${m.kurs}</div>
                        </div>
                    </div>`;
            });
            html += '</div>';
            document.getElementById('results').innerHTML = html;
        } catch (e) {
            document.getElementById('results').innerHTML = "Brak dzisiejszego raportu lub błąd połączenia.";
        }
    }

    async function fetchHistory() {
        try {
            const response = await fetch('/historia.json?t=' + Date.now());
            if (!response.ok) {
                document.getElementById('history').innerHTML = "<p style='color: #555;'>Historia dopiero się buduje...</p>";
                return;
            }
            const historiaData = await response.json();
            
            if (!historiaData || historiaData.length === 0) return;

            // ZMIENNE DO OBLICZEŃ MATEMATYCZNYCH
            let wygrane = 0;
            let przegrane = 0;
            let zyskKuponowy = 0; // Liczymy czysty profit (kurs - 1)

            const odwroconaHistoria = historiaData.reverse();
            let html = '';

            odwroconaHistoria.forEach(dzien => {
                html += `<div class="card history-card">
                            <div class="date-header">📅 Typy z dnia: ${dzien.data}</div>`;
                
                dzien.mecze.forEach(m => {
                    let statusClass = 'pending';
                    let statusText = '⌛ Oczekujący';
                    
                    if (m.status === 'wygrana') { 
                        statusClass = 'win'; 
                        statusText = '✅ TRAFIONY';
                        wygrane++;
                        // Zysk: kurs 1.85 to na czysto +0.85 jednostki
                        zyskKuponowy += (parseFloat(m.kurs.replace(',','.')) - 1);
                    }
                    if (m.status === 'przegrana') { 
                        statusClass = 'loss'; 
                        statusText = '❌ PUDŁO';
                        przegrane++;
                        // Strata: cała 1 jednostka
                        zyskKuponowy -= 1; 
                    }

                    html += `
                        <div class="match-row">
                            <div style="flex: 1;">
                                <div style="font-size: 16px; font-weight: bold; color: #ddd;">${m.mecz}</div>
                                <div class="meta">Typ: ${m.typ} (@${m.kurs})</div>
                            </div>
                            <div style="display: flex; align-items: center; margin-left: 10px;">
                                <div class="pick-box ${statusClass}" style="font-size: 12px; padding: 6px 10px;">${statusText}</div>
                            </div>
                        </div>`;
                });
                html += `</div>`;
            });

            document.getElementById('history').innerHTML = html;

            // RYSOWANIE PANELU STATYSTYK
            const sumaZakladow = wygrane + przegrane;
            if (sumaZakladow > 0) {
                const winRate = Math.round((wygrane / sumaZakladow) * 100);
                const yieldPct = ((zyskKuponowy / sumaZakladow) * 100).toFixed(2);
                
                let yieldColor = yieldPct > 0 ? 'profit' : (yieldPct < 0 ? 'loss' : 'neutral');
                let yieldZnak = yieldPct > 0 ? '+' : '';

                const statsHtml = `
                    <div class="stats-panel">
                        <div class="stat-box">
                            <div class="stat-value ${winRate >= 50 ? 'profit' : 'loss'}">${winRate}%</div>
                            <div class="stat-label">Skuteczność</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value ${yieldColor}">${yieldZnak}${yieldPct}%</div>
                            <div class="stat-label">Yield (Zysk)</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value neutral">${wygrane} - ${przegrane}</div>
                            <div class="stat-label">Bilans (W-L)</div>
                        </div>
                    </div>
                `;
                document.getElementById('stats-container').innerHTML = statsHtml;
            }

        } catch (e) {
            document.getElementById('history').innerHTML = "<p style='color: #555;'>Błąd ładowania archiwum.</p>";
        }
    }

    fetchTypy();
    fetchHistory();
</script>
</body>
</html>
