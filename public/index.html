<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Value Bets AI - Codzienne Typy</title>
    <style>
        body { background: #0d0f12; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .green { color: #00ff66; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 60px; text-transform: uppercase; margin-bottom: 0; }
        .card { background: #161a1e; border-radius: 12px; padding: 20px; margin-top: 20px; text-align: left; border: 1px solid #222; }
        .match { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding: 15px 0; }
        .pick { background: #00ff66; color: black; padding: 8px 15px; border-radius: 5px; font-weight: bold; }
        .reason { color: #888; font-size: 13px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>DZIŚ GRAMY <span class="green">MĄDRZE</span></h1>
        <p style="color: #666;">Automatyczna analiza przez Gemini AI</p>
        <div id="results">Ładowanie analizy...</div>
    </div>

    <script>
        async function loadTypy() {
            try {
                const res = await fetch('/raport.json?t=' + Date.now());
                const data = await res.json();
                if (!data.mecze || data.mecze.length === 0) {
                    document.getElementById('results').innerHTML = "Brak dostępnych typów na tę chwilę.";
                    return;
                }
                let html = '';
                data.mecze.forEach(m => {
                    html += `<div class="match">
                        <div>
                            <div class="green" style="font-size: 12px;">${m.godzina || 'Dziś'}</div>
                            <div style="font-weight: bold;">${m.mecz}</div>
                            <div class="reason">${m.analiza}</div>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <div class="pick">${m.typ}</div>
                            <div style="margin-left: 10px; color: #888;">@${m.kurs}</div>
                        </div>
                    </div>`;
                });
                document.getElementById('results').innerHTML = html;
            } catch (e) {
                document.getElementById('results').innerHTML = "Raport w drodze... Odśwież za minutę.";
            }
        }
        loadTypy();
    </script>
</body>
</html>
