name: Codzienna Analiza
on:
  schedule:
    - cron: '30 15 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generuj raport
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p public
          node scripts/generate.js

      - name: Automatyczny zapis raportu
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatyczna aktualizacja raportu [skip ci]"
          # Usunąłem file_pattern, żeby bot sam znalazł nowe pliki
          # Dodałem opcję, by nie wywalał błędu jeśli nic się nie zmieniło
          skip_dirty_check: false 
          push_options: '--force'
